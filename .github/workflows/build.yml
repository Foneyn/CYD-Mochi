
name: Build CYD firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e cyd-esp32-2432s028

      - name: Find and copy boot_app0
        run: |
          BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin -print -quit)
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" .pio/build/cyd-esp32-2432s028r/boot_app0.bin

      - name: Upload complete firmware
        uses: actions/upload-artifact@v4
        with:
          name: cyd-complete-firmware
          path: .pio/build/cyd-esp32-2432s028r/*.bin
          if-no-files-found: error
