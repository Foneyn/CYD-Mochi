
name: Build CYD firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e cyd-esp32-2432s028r

      - name: Upload complete firmware package
        uses: actions/upload-artifact@v4
        with:
          name: cyd-complete-firmware
          path: |
            .pio/build/cyd-esp32-2432s028r/bootloader.bin
            .pio/build/cyd-esp32-2432s028r/partitions.bin
            .pio/build/cyd-esp32-2432s028r/boot_app0.bin
            .pio/build/cyd-esp32-2432s028r/firmware.bin
          if-no-files-found: error
